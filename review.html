<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Confirmation page for a submitted product review.">
  <meta name="author" content="Boma Richards Ojugba">
  <title>Review Submitted</title>
  <link rel="stylesheet" href="styles/form.css">
</head>
<body>
  <header>
    <h1>Thank You!</h1>
  </header>
  <main class="confirmation">
    <h2>Your review has been submitted.</h2>
<p>Thank you for taking the time to share your product experience.</p>
<p>
  Reviews completed:
  <strong id="reviewCount">0</strong>
</p>
<a href="form.html">Submit Another Review</a>
  </main>
  <footer>
    <p>&copy; 2026 Boma Richards Ojugba | Nigeria</p>
    <p>WDD 131 - Dynamic Web Fundamentals</p>
    <p>Last Modified: <span id="lastModified"></span></p>
  </footer>
  <script>
    let reviewCount = Number(localStorage.getItem("reviewCount")) || 0;
    reviewCount++;
    localStorage.setItem("reviewCount", reviewCount);
    document.querySelector("#reviewCount").textContent = reviewCount;
    document.querySelector("#lastModified").textContent = document.lastModified;
  </script>
</body>
</html>
