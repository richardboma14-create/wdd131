<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Product review form for submitting a review and rating.">
  <meta name="author" content="Boma Richards Ojugba">
  <title>Product Review</title>
  <link rel="stylesheet" href="styles/form.css">
  <script src="scripts/form.js" defer></script>
</head>
<body>
  <header>
    <h1>Product Review</h1>
  </header>
  <main>
    <form method="get" action="review.html">
  <label for="product">Product Name</label>
  <select id="product" name="product" required>
    <option value="" disabled selected>Select a Product ...</option>
  </select>
  <fieldset>
  <legend>Overall Rating</legend>

  <label for="rating-1">
    <input type="radio" id="rating-1" name="rating" value="1" required>
    ★
  </label>

  <label for="rating-2">
    <input type="radio" id="rating-2" name="rating" value="2" required>
    ★★
  </label>

  <label for="rating-3">
    <input type="radio" id="rating-3" name="rating" value="3" required>
    ★★★
  </label>

  <label for="rating-4">
    <input type="radio" id="rating-4" name="rating" value="4" required>
    ★★★★
  </label>

  <label for="rating-5">
    <input type="radio" id="rating-5" name="rating" value="5" required>
    ★★★★★
  </label>
  </fieldset>
  <label for="installDate">Date of Installation</label>
  <input type="date" id="installDate" name="installDate" required>
  <fieldset>
    <legend>Useful Features</legend>
    <label for="durability">
      <input type="checkbox" id="durability" name="features" value="durability">
      Durability
    </label>
    <label for="ease">
      <input type="checkbox" id="ease" name="features" value="ease-of-use">
      Ease of Use
    </label>
    <label for="performance">
      <input type="checkbox" id="performance" name="features" value="performance">
      Performance
    </label>
    <label for="design">
      <input type="checkbox" id="design" name="features" value="design">
      Design
    </label>
  </fieldset>
  <label for="review">Written Review <span>(Optional)</span></label>
  <textarea id="review" name="review"></textarea>
  <label for="username">User Name <span>(Optional)</span></label>
  <input type="text" id="username" name="username">
  <input type="submit" value="Submit Review">
</form>
  </main>
  <footer>
    <p>&copy; 2026 Boma Richards Ojugba | Nigeria</p>
    <p>WDD 131 - Dynamic Web Fundamentals</p>
    <p>Last Modified: <span id="lastModified"></span></p>
  </footer>
</body>
</html>
